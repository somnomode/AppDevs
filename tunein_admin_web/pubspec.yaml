name: tunein_admin
description: "TuneIn — radio, comunidad y audio moments."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^7.0.0
  firebase_core: ^5.0.0
  firebase_storage: ^14.0.1
  just_audio: ^0.10.6
  google_maps_flutter: ^2.19.0
  file_picker: 10.3.10
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  image_picker: ^1.2.4
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700

# Splash nativo (método del profe, pre-examen 16/11). Después de cambiar
# esto, correr:  dart run flutter_native_splash:create
# Fondo = neutral-900 (#03040D), el mismo fondo de la app.
flutter_native_splash:
  color: "#03040D"
  image: assets/images/tunein_splash.png

  android_12:
    color: "#03040D"
    image: assets/images/tunein_splash.png

  android: true
  ios: true
  web: false

# Ícono de la app: cuadrado con borde "T" + cuadrado naranjo "I" (como el logo).
# Después de cambiar esto, correr:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/tunein_icon.png
  # Android 8+ (ícono adaptativo): fondo neutral-900 + el dibujo encima
  adaptive_icon_background: "#03040D"
  adaptive_icon_foreground: assets/images/tunein_icon_foreground.png
  web:
    generate: true
    image_path: assets/images/tunein_icon.png
    background_color: "#03040D"
    theme_color: "#FF6B35"
