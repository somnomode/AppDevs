name: tunein_admin
description: "TuneIn — radio, comunidad y audio moments."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^7.0.0
  firebase_core: ^5.0.0
  firebase_storage: ^14.0.1
  just_audio: ^0.10.6
  google_maps_flutter: ^2.19.0
  file_picker: 10.3.10
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  image_picker: ^1.2.4
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: Space Mono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
